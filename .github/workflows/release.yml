name: release

# Tag a release to build the plugin zip, attach it to a GitHub Release, and
# publish the version (asset URL, MD5 checksum, timestamp) to manifest.json on
# main so Jellyfin's plugin catalog can serve the update:
#   git tag v1.2.0.0 && git push origin v1.2.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jprm
        run: pip install jprm

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        id: package
        run: |
          mkdir -p artifacts
          jprm plugin build . --version "${{ steps.version.outputs.version }}" --output ./artifacts
          ZIP=$(ls artifacts/*.zip | head -1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          {
            echo "### Plugin package"
            echo ""
            echo "- file: \`$(basename "$ZIP")\`"
            echo "- md5: \`$MD5\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true

      # Runs only after the zip is attached, so the manifest never points at a
      # missing asset. Pushes with the workflow's GITHUB_TOKEN (contents: write).
      - name: Publish version to plugin manifest
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/publish-manifest.py \
            --zip "$ZIP" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$ZIP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "release: publish v${VERSION} to plugin manifest"
          git push origin main
